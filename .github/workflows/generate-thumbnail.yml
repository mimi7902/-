name: Auto Generate Thumbnail for GeekNums

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      article_title:
        description: '请输入博客文章标题'
        required: true
        default: 'GeekNums 最新硬核技术解析'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 【核心修复】安装文泉驿微米黑中文字体
    - name: Install Chinese Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-wqy-microhei

    - name: Install dependencies
      run: npm install

    - name: Generate Image using Puppeteer
      env:
        INPUT_TITLE: ${{ inputs.article_title }}
      run: |
        TITLE="${INPUT_TITLE:-GeekNums 默认文章标题}"
        node generate.js "$TITLE"

    - name: Commit & Push generated thumbnail
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: auto generated blog thumbnail with correct fonts"
        file_pattern: "thumbnail.png"
