<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      /* 深蓝黑极客背景 */
      background: #060a12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 70px 100px 50px 100px;
      position: relative;
      overflow: hidden;
    }

    /* 右侧节点与线条背景元素 */
    .bg-lines {
      position: absolute;
      right: -50px;
      bottom: -50px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    
    /* 顶部微弱网格纹理 */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    /* 中央标题区域（留出顶部居中位置） */
    .title-container {
      z-index: 2;
      width: 100%;
      text-align: center;
      margin-top: 20px;
    }

    .title {
      font-size: 50px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.5px;
      color: #f8fafc;
      text-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 底部 Logo 区域（参照图一） */
    .brand-container {
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* G+N 图标 */
    .gn-badge {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      padding: 6px 10px;
      font-weight: 900;
      font-size: 20px;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      line-height: 1;
    }

    .gn-badge span {
      color: #38bdf8;
      font-size: 14px;
      margin: 0 1px;
    }

    /* GeekNums 品牌名 */
    .brand-name {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .brand-name span {
      color: #38bdf8; /* 青蓝色高亮 */
    }

    .footer-url {
      font-size: 14px;
      color: #64748b;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="bg-lines"></div>

  <!-- 居中标题占位 -->
  <div class="title-container">
    <h1 class="title">{{TITLE}}</h1>
  </div>

  <!-- 底部品牌标识 -->
  <div class="brand-container">
    <div class="logo-box">
      <div class="gn-badge">G<span>+</span>N</div>
      <div class="brand-name">Geek<span>Nums</span></div>
    </div>
    <div class="footer-url">geeknums.com</div>
  </div>
</body>
</html>
