<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      /* 深蓝底色 */
      background-color: #030420;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      padding: 60px 0 60px 80px;
      position: relative;
      overflow: hidden;
    }

    /* 左侧内容区 */
    .left-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
      padding-right: 40px;
    }

    /* 左上角 GeekNums 品牌标识胶囊 */
    .brand-badge {
      align-self: flex-start;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 8px;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 10px;
      font-weight: 700;
      color: #93c5fd;
      letter-spacing: 1.5px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* 主标题（支持 3 行文本居左） */
    .title-container {
      margin-bottom: 40px;
    }

    .title {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.15;
      color: #ffffff;
      letter-spacing: -1px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 右侧巨大的品牌首字母巨型抽象图形 (H / N 结构) */
    .right-graphic {
      width: 360px;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      border-top-left-radius: 40px;
      border-bottom-left-radius: 40px;
      position: relative;
      margin-left: auto;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.3);
    }

    /* 图形内部缺口镂空效果 */
    .right-graphic::before {
      content: "";
      position: absolute;
      top: 0;
      right: 40px;
      width: 80px;
      height: 160px;
      background-color: #030420;
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
    }

    .right-graphic::after {
      content: "";
      position: absolute;
      bottom: 0;
      right: 40px;
      width: 80px;
      height: 160px;
      background-color: #030420;
      border-top-left-radius: 40px;
      border-top-right-radius: 40px;
    }
  </style>
</head>
<body>

  <!-- 左侧文案区 -->
  <div class="left-content">
    <!-- 左上角 GeekNums Logo 胶囊 -->
    <div class="brand-badge">
      <div class="brand-name">GeekNums</div>
      <div class="brand-sub">DIGITAL</div>
    </div>

    <!-- 标题 -->
    <div class="title-container">
      <h1 class="title">{{TITLE}}</h1>
    </div>
  </div>

  <!-- 右侧巨型蓝色图形 -->
  <div class="right-graphic"></div>

</body>
</html>
