<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background-color: #030712;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 80px;
      position: relative;
      overflow: hidden;
    }

    /* 渐变发光背景 */
    .bg-glow-top {
      position: absolute;
      top: -150px;
      left: 100px;
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .bg-glow-bottom {
      position: absolute;
      bottom: -150px;
      right: -50px;
      width: 700px;
      height: 500px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(15, 23, 42, 0) 70%);
      pointer-events: none;
    }

    /* 网格与阵列点位背景 */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(rgba(56, 189, 248, 0.15) 1px, transparent 1px),
        linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 30px 30px, 60px 60px, 60px 60px;
      pointer-events: none;
    }

    /* 右侧筛选数据流装饰 */
    .data-stream {
      position: absolute;
      right: 60px;
      top: 50px;
      font-family: monospace;
      font-size: 12px;
      color: rgba(56, 189, 248, 0.18);
      line-height: 1.6;
      pointer-events: none;
      text-align: right;
      z-index: 1;
    }

    /* 节点连线装饰（右下角） */
    .nodes-svg {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 450px;
      height: 300px;
      pointer-events: none;
      opacity: 0.35;
      z-index: 1;
    }

    /* 左上角仅保留 GeekNums 品牌名 */
    .header {
      z-index: 2;
      display: flex;
      align-items: center;
    }

    .brand-name {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-name span {
      color: #38bdf8;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
    }

    /* 居中标题区域 */
    .content {
      z-index: 2;
      margin: auto 0;
      width: 100%;
      text-align: center;
    }

    .title {
      font-size: 52px;
      font-weight: 700;
      line-height: 1.35;
      color: #f8fafc;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      padding: 0 20px;
    }

    /* 底部极客修饰线 */
    .footer-line {
      z-index: 2;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.3), transparent);
    }
  </style>
</head>
<body>
  <div class="bg-glow-top"></div>
  <div class="bg-glow-bottom"></div>

  <!-- 筛号/数据字符流背景 -->
  <div class="data-stream">
    01000111 01100101 01100101 01101011<br>
    FILTER :: STATUS_OK [200]<br>
    NUMS_PARSING_DATA_NODE_01<br>
    -------------------------<br>
    MATCHED: 98.45%
  </div>

  <!-- 节点连线 SVG 背景 -->
  <svg class="nodes-svg" viewBox="0 0 450 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 250 L150 180 L280 220 L400 100" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M120 280 L220 150 L350 180" stroke="#0ea5e9" stroke-width="1"/>
    <circle cx="150" cy="180" r="4" fill="#38bdf8"/>
    <circle cx="280" cy="220" r="5" fill="#38bdf8"/>
    <circle cx="400" cy="100" r="6" fill="#38bdf8"/>
    <circle cx="220" cy="150" r="4" fill="#0ea5e9"/>
  </svg>

  <!-- 左上角 Header 仅保留 GeekNums -->
  <div class="header">
    <div class="brand-name">
      <div class="brand-dot"></div>
      Geek<span>Nums</span>
    </div>
  </div>

  <!-- 中央标题 -->
  <div class="content">
    <h1 class="title">{{TITLE}}</h1>
  </div>

  <!-- 底部微调极客线条 -->
  <div class="footer-line"></div>
</body>
</html>
