<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      /* 背景增强：带径向微光的深蓝黑底色 */
      background: #020412 radial-gradient(circle at 20% 30%, #0d1536 0%, #020412 70%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      padding: 60px 0 60px 80px;
      position: relative;
      overflow: hidden;
    }

    /* 左侧内容区 */
    .left-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
      padding-right: 40px;
    }

    /* 左上角 GeekNums 品牌标识胶囊 - 增加微光与精致边框 */
    .brand-badge {
      align-self: flex-start;
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      box-shadow: 0 8px 20px rgba(29, 78, 216, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 10px;
      font-weight: 700;
      color: #93c5fd;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* 主标题 - 增加微弱渲染与发光 */
    .title-container {
      margin-bottom: 30px;
    }

    .title {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.15;
      color: #ffffff;
      letter-spacing: -1px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 右侧巨型图形容器 - 增加发光 Glow 效果 */
    .right-graphic-wrapper {
      position: relative;
      margin-left: auto;
      z-index: 2;
    }

    /* 后方高光蓝晕 */
    .right-graphic-wrapper::before {
      content: "";
      position: absolute;
      top: 10%;
      right: 0;
      width: 100%;
      height: 80%;
      background: #2563eb;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
    }

    .right-graphic {
      width: 380px;
      height: 100%;
      /* 更加质感的金属蓝色渐变 */
      background: linear-gradient(160deg, #3b82f6 0%, #1d4ed8 50%, #1e3a8a 100%);
      border-top-left-radius: 44px;
      border-bottom-left-radius: 44px;
      position: relative;
      box-shadow: -15px 0 40px rgba(0, 0, 0, 0.6), inset 1px 1px 2px rgba(255, 255, 255, 0.3);
    }

    /* 图形内部缺口镂空效果 - 匹配背景色与微弱投影 */
    .right-graphic::before {
      content: "";
      position: absolute;
      top: -1px;
      right: 40px;
      width: 84px;
      height: 160px;
      background: #020412;
      border-bottom-left-radius: 42px;
      border-bottom-right-radius: 42px;
      box-shadow: inset 0 -4px 10px rgba(0, 0, 0, 0.5);
    }

    .right-graphic::after {
      content: "";
      position: absolute;
      bottom: -1px;
      right: 40px;
      width: 84px;
      height: 160px;
      background: #020412;
      border-top-left-radius: 42px;
      border-top-right-radius: 42px;
      box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <!-- 左侧文案区 -->
  <div class="left-content">
    <div class="brand-badge">
      <div class="brand-name">GeekNums</div>
      <div class="brand-sub">DIGITAL</div>
    </div>

    <div class="title-container">
      <h1 class="title">{{TITLE}}</h1>
    </div>
  </div>

  <!-- 右侧巨型渲染图形区 -->
  <div class="right-graphic-wrapper">
    <div class="right-graphic"></div>
  </div>

</body>
</html>
